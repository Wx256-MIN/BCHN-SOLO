services:
  app_proxy:
    environment:
      APP_HOST: wxbch-solostrike-cash_dashboard_1
      APP_PORT: 3000

  # Uses the existing Umbrel Bitcoin Cash Node; does not launch a second node.
  pool:
    image: ghcr.io/danhaus93-ops/asicseer-pool:latest
    restart: on-failure
    stop_grace_period: 30s
    environment:
      RPC_HOST: ${APP_BITCOIN_CASH_NODE_NODE_IP}
      RPC_PORT: "8332"
      RPC_USER: ${APP_BITCOIN_CASH_NODE_RPC_USER}
      RPC_PASS: ${APP_BITCOIN_CASH_NODE_RPC_PASS}
      ZMQ_ENDPOINT: tcp://${APP_BITCOIN_CASH_NODE_NODE_IP}:28332
      BCH_ADDRESS: ""
    volumes:
      - ${APP_DATA_DIR}/data/pool:/pool
    ports:
      - "3335:3333"

  dashboard:
    image: ghcr.io/danhaus93-ops/solostrike-cash-dashboard:latest
    restart: on-failure
    environment:
      POOL_LOGDIR: /pool/logs
      STRATUM_HOST: ${DEVICE_DOMAIN_NAME:-umbrel.local}
      STRATUM_PORT: "3335"
      RPC_HOST: ${APP_BITCOIN_CASH_NODE_NODE_IP}
      RPC_PORT: "8332"
      RPC_USER: ${APP_BITCOIN_CASH_NODE_RPC_USER}
      RPC_PASS: ${APP_BITCOIN_CASH_NODE_RPC_PASS}
      APP_VERSION: v1.4.74
    volumes:
      - ${APP_DATA_DIR}/data/pool:/pool
      - ${APP_DATA_DIR}/data/sv2:/sv2
    depends_on:
      - pool

  sv2-bridge:
    image: ghcr.io/danhaus93-ops/bchn-sv2-bridge:latest
    restart: on-failure
    environment:
      BCHN_RPC_URL: http://${APP_BITCOIN_CASH_NODE_NODE_IP}:8332
      BCHN_RPC_USER: ${APP_BITCOIN_CASH_NODE_RPC_USER}
      BCHN_RPC_PASS: ${APP_BITCOIN_CASH_NODE_RPC_PASS}
      TP_PORT: "8443"
      SV2_DATA: /data
      ZMQ_ADDR: tcp://${APP_BITCOIN_CASH_NODE_NODE_IP}:28332
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${APP_DATA_DIR}/data/sv2:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sv2-pool:
    image: ghcr.io/danhaus93-ops/lonestrike-sv2-pool:latest
    restart: on-failure
    environment:
      PAYOUT_ADDRESS: ""
      BRIDGE_ADDR: sv2-bridge:8443
    volumes:
      - ${APP_DATA_DIR}/data/sv2:/data
    ports:
      - "33333:33333"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - sv2-bridge
