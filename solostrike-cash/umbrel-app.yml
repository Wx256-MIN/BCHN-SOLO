manifestVersion: 1
id: sslabs-solostrike-cash
category: bitcoin
name: LoneStrike Cash (BCHN)
version: "1.4.74"
tagline: BCH solo pool with Stratum V1 and V2, using your existing BCHN node
icon: https://raw.githubusercontent.com/danhaus93-ops/umbrel-bch-apps/master/sslabs-solostrike-cash/icon.svg
description: >-
  A separate BCH solo-mining pool with Stratum V1 and Stratum V2 support and a
  dashboard for pool status, workers, shares, and block events. Connects to the
  existing official Bitcoin Cash Node (BCHN) app using its configured RPC
  credentials. This app has separate pool data from BCHN-SOLO and does not
  replace or modify the existing pool.

  Requires the Bitcoin Cash Node app to be installed, fully synced, and
  configured to allow RPC access from this app. Stratum V1 listens on host port
  3335 and Stratum V2 on host port 33333.
developer: Wx256-MIN
website: https://github.com/Wx256-MIN/BCHN-SOLO/tree/main/solostrike-cash
dependencies:
  - bitcoin-cash-node
repo: https://github.com/Wx256-MIN/BCHN-SOLO
support: https://github.com/Wx256-MIN/BCHN-SOLO/issues
port: 3000
gallery: []
widgets:
  - id: "stats"
    type: "four-stats"
    name: "LoneStrike Cash Stats"
    refresh: "10s"
    endpoint: "dashboard:3000/api/widget/stats"
    items:
      - label: "Pool hashrate"
        jsonPath: "items[0].text"
      - label: "Miners"
        jsonPath: "items[1].text"
      - label: "Best share"
        jsonPath: "items[2].text"
      - label: "Blocks"
        jsonPath: "items[3].text"
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Pool hashrate"
          text: "Unavailable"
          subtext: "waiting for pool data"
        - title: "Miners"
          text: "0"
          subtext: "online"
        - title: "Best share"
          text: "Unavailable"
          subtext: "best diff"
        - title: "Blocks"
          text: "0"
          subtext: "found"
releaseNotes: >-
  BCHN compatibility update: uses the official bitcoin-cash-node dependency and
  configured node RPC credentials instead of a hard-coded password. Stratum V1
  uses host port 3335 to avoid conflicting with BCHN-SOLO on port 3333.
submitter: Wx256-MIN
