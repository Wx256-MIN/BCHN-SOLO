name: Build BCHN-SOLO image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Python and dashboard JavaScript syntax
        run: |
          python3 -m py_compile docker/entrypoint.py docker/api_entrypoint.py docker/setup_server.py
          python3 - <<'PY'
          from pathlib import Path

          page = Path("web/index.html").read_text(encoding="utf-8")
          start = page.find("<script>")
          end = page.find("</script>", start)
          if start < 0 or end < 0:
              raise SystemExit("Dashboard script block was not found")
          Path("/tmp/bchn-solo-dashboard.js").write_text(page[start + len("<script>"):end], encoding="utf-8")
          PY
          node --check /tmp/bchn-solo-dashboard.js

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
          tags: ghcr.io/wx256-min/bchn-solo:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
