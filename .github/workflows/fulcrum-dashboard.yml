name: Build Fulcrum dashboard image

on:
  push:
    branches: [main]
    paths:
      - "wxbch-fulcrum/web/**"
      - ".github/workflows/fulcrum-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: wxbch-fulcrum/web
          push: true
          tags: |
            ghcr.io/wx256-min/fulcrum-info:1.3.7
            ghcr.io/wx256-min/fulcrum-info:latest
