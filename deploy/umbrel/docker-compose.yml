# Reference Compose deployment for a BCHN-SOLO app container.
# Supply a .env in this directory. The host BCHN RPC/ZMQ endpoints must be reachable.
services:
  bchn-solo:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ghcr.io/wx256-min/bchn-solo:latest
    container_name: bchn-solo
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      BCHN_ZMQ_ENABLED: ${BCHN_ZMQ_ENABLED:-false}
      BCHN_ZMQ_URL: ${BCHN_ZMQ_URL:-tcp://host.docker.internal:28332}
      POOL_FEE_PERCENT: ${POOL_FEE_PERCENT:-0}
    ports:
      - "${STRATUM_PORT:-3333}:3333/tcp"
    volumes:
      - bchn-solo-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bchn-solo-data:
