# Reference Compose file for development / Umbrel packaging.
# Do not use until the BCHN port has a real Dockerfile and passes regtest.
services:
  bchn-solo:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: bchn-solo
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Stratum is LAN-accessible; firewall it to trusted miners.
      - "${STRATUM_BIND:-0.0.0.0}:${STRATUM_PORT:-3333}:${STRATUM_PORT:-3333}/tcp"
      # Keep dashboard/API local by default.
      - "127.0.0.1:${API_PORT:-3334}:${API_PORT:-3334}/tcp"
    volumes:
      - bchn-solo-data:/app/data
    security_opt:
      - no-new-privileges:true
    # Add a real healthcheck when the service exposes a verified health endpoint.
    profiles: ["scaffold"]

volumes:
  bchn-solo-data:
