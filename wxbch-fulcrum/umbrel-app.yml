manifestVersion: 1
id: wxbch-fulcrum
category: networking
name: Fulcrum (BCH)
version: "1.3.8"
icon: https://raw.githubusercontent.com/Wx256-MIN/BCHN-SOLO/main/wxbch-fulcrum/icon.svg
tagline: Electrum server for your Bitcoin Cash node — connect your wallet
description: >-
  Fulcrum is a fast Electrum server for Bitcoin Cash. It indexes your existing
  Umbrel Bitcoin Cash Node so wallets can connect to infrastructure you control.

  Requires the official bitcoin-cash-node app to be installed, fully synced,
  and configured by Umbrel. The first index build takes time and uses additional
  disk space. Connect wallets using the Electrum endpoints shown in the app.

developer: LoneStrike Labs
website: https://github.com/cculianu/Fulcrum
dependencies:
  - bitcoin-cash-node
repo: https://github.com/Wx256-MIN/BCHN-SOLO
support: https://github.com/Wx256-MIN/BCHN-SOLO/issues
port: 3001
gallery: []
path: ""
submitter: LoneStrike Labs
releaseNotes: >-
  Fixes dashboard port conflict by moving the web UI to port 3001 and using
  dashboard image version 1.3.8. Existing Fulcrum data paths are unchanged.
