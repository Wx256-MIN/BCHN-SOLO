# REFERENCE ONLY — this file is not mounted by Compose.
# Runtime configuration is generated by the init service from Umbrel-provided
# APP_BITCOIN_CASH_NODE_* variables. Do not put real RPC credentials here.
#
# Expected runtime values:
# datadir = /data
# bitcoind = <Umbrel BCHN node address>:8332
# rpcuser = <Umbrel-provided RPC user>
# rpcpassword = <Umbrel-provided RPC password>
# tcp = 0.0.0.0:50021
# ssl = 0.0.0.0:50022
# cert = /data/fulcrum.crt
# key = /data/fulcrum.key
# peering = false
# announce = false
# stats = 0.0.0.0:8081
# db_mem = 1024
# db_max_open_files = 200
# bitcoind_timeout = 600
# bitcoind_clients = 1
# worker_threads = 1
