server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /progress {
    alias /fdata/progress.txt;
    default_type text/plain;
    add_header Cache-Control no-store;
  }

  # Forward the dashboard's chain-tip request to the existing BCHN node.
  location = /tip {
    set $node_upstream http://${NODE_HOST}:8332;
    proxy_pass $node_upstream/;
    proxy_method POST;
    proxy_set_header Authorization "Basic ${RPC_BASIC_AUTH}";
    proxy_set_header Content-Type application/json;
    proxy_set_body '{"jsonrpc":"1.0","id":"tip","method":"getblockcount","params":[]}';
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }

  location /stats {
    set $fulcrum_upstream http://fulcrum:8081;
    proxy_pass $fulcrum_upstream/stats;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }
}
