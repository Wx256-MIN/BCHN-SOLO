services:
  bchn-solo:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/wx256-min/bchn-solo:latest
    container_name: bchn-solo
    restart: unless-stopped
    init: true
    environment:
      BCHN_RPC_URL: ${BCHN_RPC_URL:?Set BCHN_RPC_URL in .env}
      BCHN_RPC_USER: ${BCHN_RPC_USER:?Set BCHN_RPC_USER in .env}
      BCHN_RPC_PASSWORD: ${BCHN_RPC_PASSWORD:?Set BCHN_RPC_PASSWORD in .env}
      BCH_PAYOUT_ADDRESS: ${BCH_PAYOUT_ADDRESS:?Set BCH_PAYOUT_ADDRESS in .env}
      BCHN_ZMQ_ENABLED: ${BCHN_ZMQ_ENABLED:-true}
      BCHN_ZMQ_URL: ${BCHN_ZMQ_URL:-tcp://127.0.0.1:28332}
      POOL_FEE_PERCENT: ${POOL_FEE_PERCENT:-0}
      MIN_SHARE_DIFFICULTY: ${MIN_SHARE_DIFFICULTY:-1}
      START_SHARE_DIFFICULTY: ${START_SHARE_DIFFICULTY:-42}
    ports:
      - "${STRATUM_PORT:-3333}:3333/tcp"
    volumes:
      - bchn-solo-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bchn-solo-data:
