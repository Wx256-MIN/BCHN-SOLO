version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: wxbch-solo-pool_web_1
      APP_PORT: 8080

  # Umbrel may create APP_DATA_DIR/data as root-owned. Fix permissions
  # once before the non-root web and pool processes need to write settings/logs.
  init_perms:
    image: ghcr.io/wx256-min/bchn-solo:latest
    user: "0:0"
    entrypoint: ["sh", "-c", "mkdir -p /data && if [ ! -s /data/api.key ]; then umask 077; head -c 48 /dev/urandom | od -An -v -tx1 | tr -d ' \\n' > /data/api.key; fi && chown -R 1000:1000 /data && chmod 600 /data/api.key"]
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/data

  web:
    image: ghcr.io/wx256-min/bchn-solo:latest
    entrypoint: ["python3", "/usr/local/bin/bchn-solo-setup-server"]
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      init_perms:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      DATA_DIR: /data

  api:
    image: ghcr.io/wx256-min/bchn-solo:latest
    entrypoint: ["/usr/local/bin/bchn-solo-api-entrypoint"]
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      init_perms:
        condition: service_completed_successfully
      pool:
        condition: service_started
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      DATA_DIR: /data
      CASHSTRATUM_API_PORT: "8888"
      CASHSTRATUM_LOG_PATH: /data/logs/bchn-solo.log
      CASHSTRATUM_USER_LOGS_PATH: /data/logs/users
      CASHSTRATUM_CONF_PATH: /data/cashstratum.conf

  pool:
    image: ghcr.io/wx256-min/bchn-solo:latest
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      init_perms:
        condition: service_completed_successfully
    ports:
      - "3333:3333/tcp"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      DATA_DIR: /data
      BCHN_RPC_URL: ${APP_BITCOIN_CASH_NODE_NODE_IP}:8332
      BCHN_RPC_USER: ${APP_BITCOIN_CASH_NODE_RPC_USER}
      BCHN_RPC_PASSWORD: ${APP_BITCOIN_CASH_NODE_RPC_PASS}
      BCHN_ZMQ_ENABLED: "true"
      BCHN_ZMQ_URL: tcp://${APP_BITCOIN_CASH_NODE_NODE_IP}:28332
      POOL_FEE_PERCENT: "0"
      MIN_SHARE_DIFFICULTY: "1"
      START_SHARE_DIFFICULTY: "42"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
