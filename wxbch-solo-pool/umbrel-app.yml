manifestVersion: 1
id: wxbch-solo-pool
category: bitcoin
name: BCHN-SOLO
version: "0.2.4"
tagline: Self-hosted Bitcoin Cash solo-mining pool
description: >-
  A private Bitcoin Cash solo-mining pool using a CKPool-derived CashStratum
  engine and your existing Bitcoin Cash Node. Includes live pool/node health,
  hashrate, workers, recent accepted/rejected shares, and event monitoring,
  plus payout-address setup. Stratum V1 ASIC miners connect on port 3333.
developer: Wx256-MIN
icon: https://raw.githubusercontent.com/Wx256-MIN/BCHN-SOLO/main/wxbch-solo-pool/icon.svg
website: https://github.com/Wx256-MIN/BCHN-SOLO
dependencies:
  - bitcoin-cash-node
repo: https://github.com/Wx256-MIN/BCHN-SOLO
support: https://github.com/Wx256-MIN/BCHN-SOLO/issues
port: 8080
gallery: []
releaseNotes: "Build with portable SHA code rather than CPU-specific instructions selected from the CI builder, fixing invalid-opcode crashes on older hardware."
defaultPassword: ""
