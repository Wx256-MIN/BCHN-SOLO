manifestVersion: 1
id: wxbch-solo-pool
category: bitcoin
name: BCHN-SOLO
version: "0.2.22"
tagline: Self-hosted Bitcoin Cash solo-mining pool
description: >-
  A private Bitcoin Cash solo-mining pool using a CKPool-derived CashStratum
  engine and your existing Bitcoin Cash Node. Includes live pool/node health,
  hashrate and network metric history, tracked accepted/rejected shares,
  recent pool events, block-find summary, per-worker share quality, electricity
  estimates, and a read-only rules-first troubleshooting proposal queue.
  Proposed actions require review; execution is disabled. Stratum V1 miners connect on port 3333.
