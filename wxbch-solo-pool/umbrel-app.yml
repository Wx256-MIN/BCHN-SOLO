manifestVersion: 1
id: wxbch-solo-pool
category: bitcoin
name: BCHN-SOLO
version: "0.1.0"
tagline: Self-hosted Bitcoin Cash solo-mining pool
description: >-
  A private Bitcoin Cash solo-mining pool using a CKPool-derived CashStratum
  engine and your existing Bitcoin Cash Node. Configure a BCH CashAddr in the
  setup page, then point Stratum V1 ASIC miners to your Umbrel LAN address on
  port 3333. The default operator fee is 0%. This app does not include a
  monitoring dashboard.
developer: Wx256-MIN
website: https://github.com/Wx256-MIN/BCHN-SOLO
dependencies:
  - bitcoin-cash-node
repo: https://github.com/Wx256-MIN/BCHN-SOLO
support: https://github.com/Wx256-MIN/BCHN-SOLO/issues
port: 8080
gallery: []
releaseNotes: "Initial CKPool-derived BCH solo pool packaging. Validate the image and regtest behavior before mainnet use."
defaultPassword: ""
