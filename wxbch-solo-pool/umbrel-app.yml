website: https://github.com/Wx256-MIN/BCHN-SOLO
dependencies:
  - bitcoin-cash-node
repo: https://github.com/Wx256-MIN/BCHN-SOLO
support: https://github.com/Wx256-MIN/BCHN-SOLO/issues
port: 8080
gallery: []
releaseNotes: "Add dashboard filters/export, configurable refresh, worker last-seen estimates, block history, uptime display, electricity estimates and per-worker share quality; Stratum V1 only."
