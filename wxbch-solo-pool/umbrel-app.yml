manifestVersion: 1
id: wxbch-solo-pool
category: bitcoin
name: BCHN-SOLO
version: "0.2.16"
tagline: Self-hosted Bitcoin Cash solo-mining pool
description: >-
  A private Bitcoin Cash solo-mining pool using a CKPool-derived CashStratum
  engine and your existing Bitcoin Cash Node. Includes a dark teal monitoring
  dashboard, live pool/node health, hashrate, tracked accepted/rejected shares,
  recent pool events, block-find summary, Closest Strike estimate, recent-sample
  per-worker share quality, and a persistent electricity cost calculator. Stratum
  V1 ASIC miners connect on port 3333.
developer: Wx256-MIN
